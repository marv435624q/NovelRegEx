name: Add volume-key next episode

on:
  push:
    paths:
      - '.github/workflows/add-volume-next-episode.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch volume-key viewer navigation
        run: python3 -c "import base64; exec(base64.b64decode(''))"
      - name: Commit patch
        run: |
          git config user.name 'NovelRegEx Recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/NovelRegEx/app/activity/MainActivity.kt
          git commit -m 'Navigate to next episode with volume key at viewer end'
          git push
