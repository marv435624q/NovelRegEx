name: Fix page-mode TTS anchor

on:
  push:
    paths:
      - '.github/workflows/fix-page-mode-tts-anchor.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch visible TTS start anchor detection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p = Path('app/src/main/java/com/NovelRegEx/app/activity/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          start = s.index('    private fun captureVisibleStartAnchor(onResult: (TtsStartAnchor) -> Unit) {')
          end = s.index('    private fun collectAndStart(', start)
          payload = ''
          replacement = base64.b64decode(payload).decode('utf-8')
          patched = s[:start] + replacement + s[end:]
          if patched == s:
              raise SystemExit('Patch made no changes')
          p.write_text(patched, encoding='utf-8', newline='\n')
          PY
      - name: Commit patch
        run: |
          git config user.name 'NovelRegEx Recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/NovelRegEx/app/activity/MainActivity.kt
          git commit -m 'Fix TTS start position in page view mode'
          git push
