name: Fix volume end navigation

on:
  push:
    paths:
      - '.github/workflows/fix-volume-end-navigation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch viewer end detection
        run: echo '' | base64 --decode > /tmp/patch.py && python3 /tmp/patch.py
      - name: Commit patch
        run: |
          git config user.name 'NovelRegEx Recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/NovelRegEx/app/activity/MainActivity.kt
          git commit -m 'Fix volume navigation at viewer end'
          git push
