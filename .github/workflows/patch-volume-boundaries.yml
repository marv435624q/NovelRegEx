name: Patch volume boundary navigation

on:
  push:
    paths:
      - '.github/workflows/patch-volume-boundaries.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        env:
          PATCH_B64: 
        run: python3 -c "import os,base64; exec(base64.b64decode(os.environ['PATCH_B64']))"
      - name: Commit patch
        run: |
          git config user.name 'NovelRegEx Recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/NovelRegEx/app/activity/MainActivity.kt app/src/main/res/values/arrays.xml app/src/main/res/values-ko/arrays.xml app/src/main/res/values/strings.xml app/src/main/res/values-ko/strings.xml gradle.properties
          git commit -m 'Add previous-episode boundary navigation and volume reversal'
          git push
