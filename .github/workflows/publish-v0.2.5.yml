name: Publish v0.2.5

on:
  push:
    paths:
      - '.github/workflows/publish-v0.2.5.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.jks"

      - name: Build signed v0.2.5 APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:buildReleaseApk --stacktrace

      - name: Verify signing certificate
        run: |
          APK="$GITHUB_WORKSPACE/apk/NovelRegEx-v0.2.5.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
          grep -qi 'f603c9dd599188e5d41f299f067b6a4e4c1d84e130a98f0254a34ace29b5fc35' certs.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.5 \
            "$GITHUB_WORKSPACE/apk/NovelRegEx-v0.2.5.apk#NovelRegEx-v0.2.5.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'NovelRegEx v0.2.5' \
            --notes 'Fixes TTS start-position detection in page view mode and makes volume-button forward navigation advance to the next episode at the true end of scroll view or the last page.'
