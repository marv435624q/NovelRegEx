name: Recovery resource fix

on:
  push:
    paths:
      - '.github/workflows/recovery-resource-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix recovered Android string escaping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/res/values-ko/strings.xml')
          s = p.read_text(encoding='utf-8')
          old = '<string name="press_twice_to_exit">\'뒤로\' 버튼을 한 번 더 누르시면 종료됩니다.</string>'
          new = '<string name="press_twice_to_exit">\\\'뒤로\\\' 버튼을 한 번 더 누르시면 종료됩니다.</string>'
          if old not in s:
              raise SystemExit('Expected press_twice_to_exit string not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
      - name: Commit fix
        run: |
          git config user.name 'NovelRegEx Recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/res/values-ko/strings.xml
          git commit -m 'Fix Korean Android string escaping'
          git push
